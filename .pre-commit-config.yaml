repos:
  - repo: local
    hooks:
      - id: justfile-fmt
        name: just --fmt
        entry: just --fmt
        language: system
        pass_filenames: false
      - id: crates-fmt-check
        name: just fmt-check
        entry: just fmt-check
        language: system
        pass_filenames: false
      - id: crates-check
        name: just check
        entry: just check
        language: system
        pass_filenames: false
      - id: charts-lint
        name: just charts lint
        entry: just charts lint
        language: system
        pass_filenames: false
