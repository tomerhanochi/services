[workspace]
members = [
    "crates/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
axum = "0.8.9"
tokio = "1.53.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false }
