[workspace]
members = [
    "lib/*",
    "bin/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace.dependencies]
axum = "0.8.9"
tokio = "1.53.2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
subtle = "2.6"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "migrate", "macros"] }
thiserror = "2"
error-stack = "0.8"
hotpath = "0.28.6"
