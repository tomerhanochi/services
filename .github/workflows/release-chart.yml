name: Release Helm chart

on:
  workflow_dispatch:
    inputs:
      bin:
        description: Helm chart to release
        required: true
        type: choice
        options:
          - file-server

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    env:
      BIN: ${{ inputs.bin }}
      REGISTRY: ghcr.io/${{ github.repository }}/charts
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1

      - name: Package chart
        id: package
        run: |
          helm package "charts/${BIN}" --destination "${RUNNER_TEMP}"
          echo "chart_path=$(find "${RUNNER_TEMP}" -name "${BIN}*.tgz")" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        id: push
        env:
          CHART_PATH: ${{ steps.package.outputs.chart_path }}
        run: |
          push_output="$(helm push "${CHART_PATH}" "oci://${REGISTRY}")"
          printf '%s\n' "${push_output}"

          digest="$(grep -oE 'sha256:[[:xdigit:]]{64}' <<< "${push_output}")"

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${BIN}@${DIGEST}"
