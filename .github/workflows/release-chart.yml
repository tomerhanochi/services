name: Release Helm chart

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1

      - name: Package chart
        run: helm package charts/file-server --destination "$RUNNER_TEMP"

      - name: Extract chart version
        id: chart
        run: |
          version="$(helm show chart "$RUNNER_TEMP"/file-server-*.tgz -o json | jq -r .version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
        run: helm push "$RUNNER_TEMP"/file-server-*.tgz "oci://ghcr.io/${OWNER}/services/charts"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign chart
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: cosign sign --yes "ghcr.io/${OWNER}/services/charts/file-server:${VERSION}"
