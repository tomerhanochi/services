name: Release Helm chart

on:
  workflow_dispatch:
    inputs:
      chart_version:
        description: SemVer version to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1

      - name: Lint chart
        run: helm lint charts/file-server

      - name: Package chart
        env:
          CHART_VERSION: ${{ inputs.chart_version }}
        run: helm package charts/file-server --version "$CHART_VERSION" --destination "$RUNNER_TEMP"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        env:
          CHART_VERSION: ${{ inputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
        run: helm push "$RUNNER_TEMP/file-server-${CHART_VERSION}.tgz" "oci://ghcr.io/${OWNER}/services/charts"
