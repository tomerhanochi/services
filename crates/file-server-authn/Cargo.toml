[package]
name = "file-server-authn"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
hotpath = { workspace = true }
authn-identity = { path = "../authn-identity" }
authn = { path = "../authn" }
authn-axum = { path = "../authn-axum" }
authn-token = { path = "../authn-token" }
authn-token-axum = { path = "../authn-token-axum" }
authn-oidc = { path = "../authn-oidc" }
authn-oidc-axum = { path = "../authn-oidc-axum" }
axum = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
toml = "0.9"

[features]
hotpath = ["hotpath/hotpath"]
