[package]
name = "file_server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Self-hosted file browser with PostgreSQL-backed access and configurable authentication."

[dependencies]
hotpath = { workspace = true }
file_server_authn = { path = "../file_server_authn" }
file_server_core = { path = "../file_server_core" }
file_server_fs = { path = "../file_server_fs" }
file_server_postgres = { path = "../file_server_postgres" }
file_server_web = { path = "../file_server_web" }
htmlb_components = { path = "../htmlb_components" }
htmlb_components_theme = { path = "../htmlb_components_theme" }
authn-identity = { path = "../authn-identity" }
axum = { workspace = true }
figment = { version = "0.10", features = ["toml", "env"] }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
argon2 = { workspace = true }
rand = "0.8"
sqlx = { workspace = true }
authn-token = { path = "../authn-token" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
toml = "0.9"

[features]
hotpath = ["hotpath/hotpath", "hotpath/axum-0-8", "hotpath/sqlx", "hotpath/tokio"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-prometheus = ["hotpath", "hotpath/hotpath-prometheus"]
