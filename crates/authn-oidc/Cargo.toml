[package]
name = "authn-oidc"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
authn-identity = { path = "../authn-identity" }
authn = { path = "../authn" }
openidconnect = { version = "4.0", default-features = false, features = ["reqwest", "rustls-tls"] }
base64 = { workspace = true }
subtle = { workspace = true }
rand = "0.8"
serde = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net"] }
axum = { workspace = true }
serde_json = "1"
chrono = "0.4"
