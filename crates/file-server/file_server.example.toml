listen = "127.0.0.1:8080"
public_url = "http://localhost:8080"

[database]
url = "postgres://file_server:development-only@localhost:15432/file_server"
max_connections = 10

# Optional OIDC settings and provider-subject -> local user mapping:
# [auth.oidc]
# issuer = "https://issuer.example"
# client_id = "files"
# redirect_uri = "https://files.example/auth/callback"
# [auth.oidc.users]
# provider-subject = "alice"

# Optional token store (persist only token digests in authn_api_tokens):
# [auth.token]
# database_url = "postgres://file_server:development-only@localhost:15432/file_server"

[[mounts]]
name = "documents"
path = "documents"

[roles.admin]
documents = "editor"
[roles.readers]
documents = "viewer"

[users]
alice = ["admin"]
bob = ["readers"]

[machines]
backup = ["readers"]
