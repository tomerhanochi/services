[package]
name = "file-server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Self-hosted file browser with PostgreSQL-backed access and configurable authentication."

[dependencies]
hotpath = { workspace = true }
error-stack = { workspace = true }
file-server-authn = { path = "../file-server-authn" }
file-server-core = { path = "../file-server-core" }
file-server-fs = { path = "../file-server-fs" }
file-server-postgres = { path = "../file-server-postgres" }
file-server-web = { path = "../file-server-web" }
htmlb-components = { path = "../htmlb-components" }
htmlb-components-theme = { path = "../htmlb-components-theme" }
authn-identity = { path = "../authn-identity" }
axum = { workspace = true }
figment = { version = "0.10", features = ["toml", "env"] }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"
sqlx = { workspace = true }
authn-token = { path = "../authn-token" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
toml = "0.9"

[features]
hotpath = ["hotpath/hotpath", "hotpath/axum-0-8", "hotpath/sqlx", "hotpath/tokio"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-prometheus = ["hotpath", "hotpath/hotpath-prometheus"]
