name: file-server-profiling
services:
  prometheus:
    image: prom/prometheus:v3.13.3
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
  grafana:
    image: grafana/grafana:12.3.8
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-profiling
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./dashboards.yaml:/etc/grafana/provisioning/dashboards/file-server.yaml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/file-server.json:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 30
