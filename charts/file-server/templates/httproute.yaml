{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "file-server.fullname" . }}
  labels:
    {{- include "file-server.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
{{ required "httpRoute.parentRefs must reference at least one Gateway" .Values.httpRoute.parentRefs | toYaml | indent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
{{ toYaml . | indent 4 }}
  {{- end }}
  rules:
{{ range .Values.httpRoute.rules }}
    - matches:
{{ toYaml .matches | indent 8 }}
      {{- with .filters }}
      filters:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .timeouts }}
      timeouts:
{{ toYaml . | indent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "file-server.fullname" $ }}
          port: {{ $.Values.service.port }}
{{ end }}
{{- end }}
